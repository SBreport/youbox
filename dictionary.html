<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>구조 사전 — youbox</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/study.css">
</head>
<body>

<div class="header">
  <h1>🧱 구조 사전</h1>
  <div class="header-actions">
    <a href="shortform-study.html" class="btn btn-secondary" style="text-decoration:none;font-size:12px;">+ 끝내기 추가</a>
    <button class="theme-toggle" id="themeToggle" title="테마 전환">
      <span id="themeIcon">&#9788;</span>
    </button>
  </div>
</div>

<div style="max-width:760px;margin:0 auto;padding:24px 20px 80px;">

  <div class="dict-category-grid">
    <div class="dict-category-card">
      <div class="dict-cat-icon">🎬</div>
      <div class="dict-cat-name">도입부</div>
      <div class="dict-cat-count" id="dictCount_intro">0개</div>
    </div>
    <div class="dict-category-card">
      <div class="dict-cat-icon">🎯</div>
      <div class="dict-cat-name">후크</div>
      <div class="dict-cat-count" id="dictCount_hook">0개</div>
    </div>
    <div class="dict-category-card">
      <div class="dict-cat-icon">📌</div>
      <div class="dict-cat-name">표시 제목</div>
      <div class="dict-cat-count" id="dictCount_overlay">0개</div>
    </div>
    <div class="dict-category-card">
      <div class="dict-cat-icon">✂️</div>
      <div class="dict-cat-name">컷 패턴</div>
      <div class="dict-cat-count" id="dictCount_cut">0개</div>
    </div>
    <div class="dict-category-card">
      <div class="dict-cat-icon">🎁</div>
      <div class="dict-cat-name">결론 CTA</div>
      <div class="dict-cat-count" id="dictCount_cta">0개</div>
    </div>
    <div class="dict-category-card">
      <div class="dict-cat-icon">🔑</div>
      <div class="dict-cat-name">키 템플릿</div>
      <div class="dict-cat-count" id="dictCount_key">0개</div>
    </div>
  </div>

  <div class="sf-placeholder-notice" id="dictNotice" style="margin-top:32px;">
    🆕 0개 카드 — <a href="shortform-study.html" style="color:var(--accent);">끝내기</a>에서 분석을 완료하면 카드가 쌓입니다. 본격 검색·필터는 S3에서 구현됩니다.
  </div>

</div>

<script>
  function getTheme() { return localStorage.getItem('broll-theme') || 'dark'; }
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    var icon = document.getElementById('themeIcon');
    if (icon) icon.innerHTML = theme === 'dark' ? '&#9788;' : '&#9790;';
    localStorage.setItem('broll-theme', theme);
  }
  applyTheme(getTheme());
  document.getElementById('themeToggle').onclick = function () {
    applyTheme(getTheme() === 'dark' ? 'light' : 'dark');
  };
</script>
<script src="js/dictionary-db.js"></script>
<script src="js/dictionary.js"></script>
<script src="js/nav.js"></script>
</body>
</html>
