<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>숏폼 강의 — youbox</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/guide.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>

<div class="header">
  <div style="display:flex;align-items:center;gap:12px;">
    <button class="guide-hamburger btn-icon" id="guideSidebarToggle" title="목차 열기/닫기" style="display:none;">&#9776;</button>
    <h1>📚 숏폼 강의</h1>
  </div>
  <div class="header-actions">
    <button class="theme-toggle" id="themeToggle" title="테마 전환">
      <span id="themeIcon">&#9788;</span>
    </button>
  </div>
</div>

<div class="guide-layout">
  <!-- Sidebar -->
  <aside class="guide-sidebar" id="guideSidebar">
    <nav id="guideLectureList" class="guide-lecture-list"></nav>
  </aside>

  <!-- Overlay for mobile -->
  <div class="guide-overlay" id="guideOverlay"></div>

  <!-- Main content -->
  <div class="guide-main">
    <div class="guide-content" id="guideContent">
      <div class="guide-loading" id="guideLoading">강의를 불러오는 중...</div>
    </div>
    <div class="guide-nav" id="guideNav" style="display:none;">
      <button class="btn btn-secondary guide-nav-prev" id="guidePrevBtn" disabled>← 이전 강</button>
      <button class="btn btn-secondary guide-nav-next" id="guideNextBtn" disabled>다음 강 →</button>
    </div>
  </div>
</div>

<script>
  // Theme (standalone)
  function getTheme() { return localStorage.getItem('broll-theme') || 'dark'; }
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    const icon = document.getElementById('themeIcon');
    if (icon) icon.innerHTML = theme === 'dark' ? '&#9788;' : '&#9790;';
    localStorage.setItem('broll-theme', theme);
  }
  function toggleTheme() { applyTheme(getTheme() === 'dark' ? 'light' : 'dark'); }
  applyTheme(getTheme());
  document.getElementById('themeToggle').onclick = toggleTheme;

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }
</script>
<script src="js/guide-data.js"></script>
<script src="js/guide-markdown.js"></script>
<script src="js/guide.js"></script>
<script src="js/nav.js"></script>
</body>
</html>
